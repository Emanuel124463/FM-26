<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM Career 2026 — Carregando</title>
<link rel="stylesheet" href="../css/loading.css">
</head>
<body>
  <main class="loading-screen" aria-label="Carregando FM Career 2026">
    <div class="loading-background"></div>
    <div class="loading-overlay"></div>

    <header class="loading-brand">
      <div class="brand-shield">◇</div>
      <div>
        <strong>FM 26</strong>
      </div>
    </header>

    <section class="loading-content">
      <h1>CARREGANDO...</h1>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="loading-tip" id="loadingTip">Dica: Treine jovens promessas para valorizar seu clube</p>
    </section>

    <div class="loading-percent" id="loadingPercent">0%</div>
  </main>
  <script src="../js/loading.js"></script>
</body>
</html>
